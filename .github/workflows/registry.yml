name: Registry

# Blocking pre-deploy gate: a push that breaks the registry can't ship.
# Every step is required. Items are enumerated from registry.json by the
# scripts, so new items are covered with no changes here.
on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify registry contract
    runs-on: ubuntu-latest
    # workerd/esbuild/sharp need their build scripts (allow-listed via the
    # package.json pnpm.onlyBuiltDependencies field); SHARP_IGNORE_GLOBAL_LIBVIPS
    # forces sharp's prebuilt binary instead of a source build.
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Steps a–d: validate + build + view/list/add --dry-run + real smoke
      # install of every item into two throwaway projects (shadcn init -b base
      # and -b radix, nova preset) with the usage-checks, then tsc on both.
      # This is the check that proves "add -> code that compiles" on each base.
      - name: Verify registry (validate, build, install, typecheck)
        run: bash scripts/verify-registry.sh

      # The app + registry sources and usage-checks against the site's own
      # (Base UI) shadcn wrappers.
      - name: Typecheck the app + registry sources
        run: pnpm run typecheck

      # The site must build (prebuild runs `shadcn build` -> public/r).
      - name: Build the site
        run: pnpm run build
